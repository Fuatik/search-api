services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: search-api-postgres
    environment:
      POSTGRES_DB: searchapi
      POSTGRES_USER: searchapi
      POSTGRES_PASSWORD: searchapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchapi -d searchapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
