services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: search-api-postgres
    environment:
      POSTGRES_DB: searchapi
      POSTGRES_USER: searchapi
      POSTGRES_PASSWORD: searchapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchapi -d searchapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: search-api-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/searchapi
      SPRING_DATASOURCE_USERNAME: searchapi
      SPRING_DATASOURCE_PASSWORD: searchapi
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
