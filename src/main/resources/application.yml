spring:
  application:
    name: search-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/searchapi}
    username: ${SPRING_DATASOURCE_USERNAME:searchapi}
    password: ${SPRING_DATASOURCE_PASSWORD:searchapi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  embedding:
    provider: hashing
    hashing:
      dimensions: 384
  search:
    page-size-default: 20
    weights:
      lexical: 0.5
      semantic: 0.3
      trigram: 0.2
    synonyms-path: classpath:synonyms/search-synonyms.yaml
  summary:
    provider: extractive
    extractive:
      min-sentences: 2
      max-sentences: 3
    ollama:
      base-url: http://localhost:11434
      model: llama3.2:1b
